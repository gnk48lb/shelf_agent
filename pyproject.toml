[project]
name = "shelf-agent"
version = "0.1.0"
description = "螺丝装箱到搬运上架的离线仿真环境与异常自愈 agent 骨架"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "pillow>=10.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
shelf-agent = "shelf_agent.eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shelf_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:shelf_agent.*"]

[tool.coverage.run]
source = ["shelf_agent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
